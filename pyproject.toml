[project]
name = "frontal-atlas"
version = "0.1.0"
description = "Frontal and cyclone climatology from the NWS Coded Surface Bulletin archive"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plot = ["cartopy>=0.23", "metpy>=1.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
